name: CI Build

on:
  push:
    branches: [ '**' ]  # 所有分支的推送都会触发
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:  # 允许手动触发
    inputs:
      create_release:
        description: 'Create a release after build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      release_tag:
        description: 'Release tag (only if creating release)'
        required: false
        default: 'ci-latest'

permissions:
  contents: write  # 允许创建 release
  packages: write  # 允许上传包
  actions: read    # 允许读取 actions

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install NDK and CMake
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-32" "platforms;android-34" "build-tools;30.0.3" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
    
    - name: Build ConfigApp
      run: |
        cd configapp
        ../gradlew assembleDebug
        cd ..
        
    - name: Build Module
      run: |
        cd module
        ../gradlew assembleRelease -PtargetAbis=arm64-v8a
        cd ..
    
    - name: Package Module for Testing
      run: |
        # Reuse the tested Gradle ZIP, including installer and update-preservation scripts.
        cp out/zygisk-myinjector-*-release.zip zygisk-myinjector-ci.zip
        unzip -t zygisk-myinjector-ci.zip

    - name: Upload Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: module-ci-${{ github.sha }}
        path: zygisk-myinjector-ci.zip
        retention-days: 7
        
    - name: Upload ConfigApp Artifact
      uses: actions/upload-artifact@v4
      with:
        name: configapp-ci-${{ github.sha }}
        path: configapp/build/outputs/apk/debug/configapp-debug.apk
        retention-days: 7
    
    - name: Prepare Release Files
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      run: |
        # 准备发布文件
        mkdir -p release-files
        cp zygisk-myinjector-ci.zip release-files/zygisk-myinjector-${{ github.event.inputs.release_tag }}.zip
        cp configapp/build/outputs/apk/debug/configapp-debug.apk release-files/ConfigApp-${{ github.event.inputs.release_tag }}.apk
        
        echo "Release files:"
        ls -la release-files/
    
    - name: Create Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.event.inputs.release_tag }}
        name: CI Release ${{ github.event.inputs.release_tag }}
        body: |
          ## CI Build Release
          
          - **Build Type**: Manual CI Release
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Run ID**: ${{ github.run_id }}
          
          ### 下载
          - 模块文件: `zygisk-myinjector-${{ github.event.inputs.release_tag }}.zip`
          - 配置应用: `ConfigApp-${{ github.event.inputs.release_tag }}.apk`
          
          ### 安装说明
          1. 在 Magisk Manager 中安装模块 ZIP
          2. 重启设备
          3. ConfigApp 会自动安装
          
          ---
          *这是一个 CI 构建版本，可能不稳定*
        draft: false
        prerelease: true
        files: |
          release-files/zygisk-myinjector-*.zip
          release-files/ConfigApp-*.apk